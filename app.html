<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaskMath</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #0f141b; color: #e8eef5; max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin: 0 0 4px; }
  p.sub { color: #9fb0c3; margin: 0 0 20px; }
  .presets { margin: 0 0 20px; }
  .presets button { background: #1c2530; color: #9fc2e8; border: 1px solid #2d3b4d; border-radius: 999px; padding: 8px 16px; margin: 0 8px 8px 0; cursor: pointer; font-size: .9rem; }
  .presets button:hover { background: #253243; }
  section { background: #16202c; border: 1px solid #243143; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  h2 { margin: 0 0 14px; font-size: 1.05rem; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
  label { display: block; font-size: .8rem; color: #9fb0c3; margin-bottom: 4px; }
  input { background: #0f141b; border: 1px solid #2d3b4d; color: #e8eef5; border-radius: 8px; padding: 9px 10px; width: 100px; font-size: 1rem; }
  .outs { display: flex; flex-wrap: wrap; gap: 14px; }
  .out { background: #101922; border: 1px solid #243143; border-radius: 12px; padding: 14px 18px; min-width: 140px; flex: 1; }
  .out .v { font-size: 1.4rem; font-weight: 700; color: #7fc4ff; }
  .out .k { font-size: .8rem; color: #9fb0c3; margin-top: 4px; }
  .wide { min-width: 260px; }
  .wide .v { font-size: 1.05rem; line-height: 1.45; }
</style>
</head>
<body>
<h1>&#129347; CaskMath</h1>
<p class="sub">Whisky dilution and cask math - the water is part of the pour.</p>
<div class="presets" id="presets"></div>

<section>
  <h2>1. Dilute the pour</h2>
  <div class="row">
    <div><label>Pour (ml)</label><input id="vol" type="number" step="5" value="50"></div>
    <div><label>Current ABV %</label><input id="abvfrom" type="number" step="0.1" value="60"></div>
    <div><label>Target ABV %</label><input id="abvto" type="number" step="0.1" value="46"></div>
  </div>
  <div class="outs">
    <div class="out"><div class="v" id="o-water">-</div><div class="k">Water to add</div></div>
    <div class="out"><div class="v" id="o-drops">-</div><div class="k">In drops</div></div>
    <div class="out"><div class="v" id="o-proof">-</div><div class="k">US proof (target)</div></div>
    <div class="out wide"><div class="v" id="o-verdict">-</div><div class="k">Strength verdict</div></div>
  </div>
</section>

<section>
  <h2>2. Angel's share</h2>
  <div class="row">
    <div><label>Cask (liters)</label><input id="cask" type="number" step="5" value="200"></div>
    <div><label>Years</label><input id="years" type="number" step="1" value="12"></div>
    <div><label>Loss % / year</label><input id="loss" type="number" step="0.1" value="2"></div>
    <div><label>Bottle (ml)</label><input id="bottle" type="number" step="50" value="700"></div>
  </div>
  <div class="outs">
    <div class="out"><div class="v" id="o-left">-</div><div class="k">Left in cask</div></div>
    <div class="out"><div class="v" id="o-angels">-</div><div class="k">The angels took</div></div>
    <div class="out"><div class="v" id="o-bottles">-</div><div class="k">Bottles</div></div>
  </div>
</section>

<section>
  <h2>3. The honest shelf</h2>
  <div class="row">
    <div><label>Bottle price</label><input id="price" type="number" step="5" value="90"></div>
    <div><label>Dram (ml)</label><input id="dram" type="number" step="5" value="25"></div>
  </div>
  <div class="outs">
    <div class="out"><div class="v" id="o-cost">-</div><div class="k">Cost per dram</div></div>
    <div class="out"><div class="v" id="o-drams">-</div><div class="k">Drams per bottle</div></div>
  </div>
</section>

<script>
// CaskMath engine - whisky dilution and cask math. Pure functions, no DOM.
(function (root) {
  'use strict';

  // Water (ml) to add to volMl of spirit at abvFrom (%) to reach abvTo (%).
  function waterToAdd(volMl, abvFrom, abvTo) {
    if (volMl < 0 || abvFrom <= 0 || abvTo <= 0) throw new Error('positive values only');
    if (abvTo >= abvFrom) throw new Error('target must be lower than current strength');
    return volMl * (abvFrom / abvTo - 1);
  }

  // Resulting ABV after adding waterMl to volMl at abv (%).
  function abvAfterDilution(volMl, abv, waterMl) {
    if (volMl <= 0 || abv < 0 || waterMl < 0) throw new Error('bad inputs');
    return abv * volMl / (volMl + waterMl);
  }

  // Drops (1 drop ~ 0.05 ml) for a water addition.
  function dropsFor(waterMl) {
    if (waterMl < 0) throw new Error('negative water');
    return waterMl / 0.05;
  }

  // US proof = 2 x ABV.
  function usProof(abv) {
    return abv * 2;
  }

  // Angel's share: volume left after years of annual lossPct evaporation.
  function angelsShare(startLiters, years, lossPct) {
    if (startLiters < 0 || years < 0 || lossPct < 0) throw new Error('bad inputs');
    return startLiters * Math.pow(1 - lossPct / 100, years);
  }

  // Bottles (floor) of bottleMl from liters remaining.
  function bottlesFrom(liters, bottleMl) {
    if (liters < 0 || bottleMl <= 0) throw new Error('bad inputs');
    return Math.floor(liters * 1000 / bottleMl);
  }

  // Cost per dram.
  function costPerDram(price, bottleMl, dramMl) {
    if (price < 0 || bottleMl <= 0 || dramMl <= 0) throw new Error('bad inputs');
    return price / (bottleMl / dramMl);
  }

  // Strength verdict for sipping.
  function strengthVerdict(abv) {
    if (abv >= 55) return 'cask strength - a few drops of water will open it up';
    if (abv >= 46) return 'full proof - non-chill-filtered territory, drinks bold';
    if (abv >= 43) return 'standard strength - balanced as poured';
    if (abv >= 40) return 'entry strength - easy, maybe a little quiet';
    return 'below 40 - that is a liqueur or a very sad whisky';
  }

  var api = {
    waterToAdd: waterToAdd,
    abvAfterDilution: abvAfterDilution,
    dropsFor: dropsFor,
    usProof: usProof,
    angelsShare: angelsShare,
    bottlesFrom: bottlesFrom,
    costPerDram: costPerDram,
    strengthVerdict: strengthVerdict
  };
  root.CaskMath = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  var E = window.CaskMath;
  function num(id) { return parseFloat(document.getElementById(id).value) || 0; }
  function set(id, v) { document.getElementById(id).textContent = v; }

  function compute() {
    var vol = num('vol'), from = num('abvfrom'), to = num('abvto');
    if (vol > 0 && from > 0 && to > 0 && to < from) {
      var w = E.waterToAdd(vol, from, to);
      set('o-water', (Math.round(w * 10) / 10) + ' ml');
      set('o-drops', '~' + Math.round(E.dropsFor(w)));
      set('o-proof', Math.round(E.usProof(to)));
      set('o-verdict', E.strengthVerdict(to));
    } else if (to >= from && from > 0 && to > 0) {
      set('o-water', 'none'); set('o-drops', '0');
      set('o-proof', Math.round(E.usProof(to)));
      set('o-verdict', 'target is not below current strength - no water needed');
    } else {
      ['o-water','o-drops','o-proof','o-verdict'].forEach(function (id) { set(id, '-'); });
    }
    var cask = num('cask'), years = num('years'), loss = num('loss'), bottle = num('bottle');
    if (cask > 0 && bottle > 0) {
      var left = E.angelsShare(cask, years, loss);
      set('o-left', (Math.round(left * 10) / 10) + ' L');
      set('o-angels', (Math.round((cask - left) * 10) / 10) + ' L');
      set('o-bottles', E.bottlesFrom(left, bottle));
    }
    var price = num('price'), dram = num('dram');
    if (price > 0 && bottle > 0 && dram > 0) {
      set('o-cost', (Math.round(E.costPerDram(price, bottle, dram) * 100) / 100).toFixed(2));
      set('o-drams', Math.floor(bottle / dram));
    }
  }

  var presets = [
    { name: 'Cask strength dram', v: { vol: 50, abvfrom: 60, abvto: 46, cask: 200, years: 12, loss: 2, bottle: 700, price: 90, dram: 25 } },
    { name: 'Just a few drops', v: { vol: 30, abvfrom: 58.5, abvto: 50, cask: 200, years: 10, loss: 2, bottle: 700, price: 130, dram: 25 } },
    { name: 'Sherry butt', v: { vol: 50, abvfrom: 55, abvto: 43, cask: 500, years: 18, loss: 2.5, bottle: 700, price: 240, dram: 25 } },
    { name: 'Daily pour', v: { vol: 40, abvfrom: 43, abvto: 40, cask: 200, years: 8, loss: 2, bottle: 700, price: 45, dram: 30 } }
  ];
  var holder = document.getElementById('presets');
  presets.forEach(function (p) {
    var b = document.createElement('button');
    b.textContent = p.name;
    b.addEventListener('click', function () {
      Object.keys(p.v).forEach(function (k) {
        var el = document.getElementById(k);
        if (el) el.value = p.v[k];
      });
      compute();
    });
    holder.appendChild(b);
  });

  ['vol', 'abvfrom', 'abvto', 'cask', 'years', 'loss', 'bottle', 'price', 'dram'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('input', compute);
    el.addEventListener('change', compute);
  });
  compute();
})();
</script>
</body>
</html>
